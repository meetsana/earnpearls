name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: earnpearls_test
          POSTGRES_USER: earnpearls
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U earnpearls -d earnpearls_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://earnpearls:test-only-password@127.0.0.1:5432/earnpearls_test
      TEST_DATABASE_URL: postgres://earnpearls:test-only-password@127.0.0.1:5432/earnpearls_test
      DATABASE_SSL: "false"
      APP_ORIGINS: http://localhost:5173
      PUBLIC_APP_URL: http://localhost:5173
      PASSWORD_PEPPER: test-password-pepper-not-for-production
      IP_HASH_SECRET: test-ip-hash-secret-not-for-production
      DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      PROVIDER_WEBHOOK_SECRET: test-provider-secret
      ENABLE_SWAGGER: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
      - run: npm run audit:mvp
      - run: npm run staging:validate
      - name: Verify staging seed remains synthetic and payout-disabled
        if: github.ref == 'refs/heads/staging'
        env:
          ALLOW_DEMO_DATA: "true"
          SEED_ADMIN_EMAIL: staging-admin@example.com
          SEED_ADMIN_PASSWORD: staging-CI-password-only-2026
          SEED_ADMIN_COUNTRY: US
        run: >-
          npm run db:seed &&
          npm run db:verify-staging --workspace @earnpearls/api
      - name: Build staging API image
        run: docker build -f infra/docker/api.Dockerfile -t earnpearls-api:${{ github.sha }} .
      - run: npm run openapi:generate
      - name: Verify generated API contract is committed
        run: git diff --exit-code -- docs/api/openapi.json
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency audit
        run: npm audit --audit-level=low
